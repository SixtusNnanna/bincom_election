
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bincom Election Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f4f6f8;
            color: #222;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input, button {
            padding: 12px;
            font-size: 16px;
        }

        input {
            width: 220px;
        }

        button {
            border: 0;
            border-radius: 5px;
            background: #176b55;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #e9f3ef;
        }

        .error {
            color: #b42318;
        }

        .muted {
            color: #666;
        }
    </style>
</head>
<body>
    {% include "components/navbar.html" %}
    <div class="panel">
        <h1>Election Results</h1>
        <p class="muted">
            Enter a polling unit's unique ID to view its party results.
        </p>

        <form action="/polling-unit-results" method="get">
            <input
                type="number"
                name="unit_id"
                min="1"
                placeholder="Polling unit ID"
                value="{{ unit_id or '' }}"
                required
            >
            <button type="submit">View Results</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if polling_unit %}
            <h2>{{ polling_unit.polling_unit_name or "Unnamed polling unit" }}</h2>
            <p class="muted">Unique ID: {{ polling_unit.uniqueid }}</p>

            <ResultsTable :results="results" />
        {% endif %}
    </div>
</body>
</html>
